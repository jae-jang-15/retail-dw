name: CI (test every pull request)

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ci
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_CI_SCHEMA: pr_${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install -r requirements.txt
      - name: Save the Snowflake key
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "$KEY" > ~/.snowflake/dbt_svc_key.p8
      - name: Install dbt packages
        run: dbt deps
      - name: Build and test everything in a throwaway schema
        run: dbt build --target ci
      - name: Delete the throwaway schemas
        if: always()
        run: |
          dbt run-operation drop_ci_schemas --args "{prefix: $DBT_CI_SCHEMA}" --target ci
