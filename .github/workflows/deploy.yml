name: Deploy (build production)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-production:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ci
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install -r requirements.txt
      - name: Save the Snowflake key
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "$KEY" > ~/.snowflake/dbt_svc_key.p8
      - name: Install dbt packages
        run: dbt deps
      - name: Build and test production
        run: dbt build --target prod
