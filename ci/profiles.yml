retail_dw:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: DBT_SVC
      private_key_path: "{{ env_var('HOME') }}/.snowflake/dbt_svc_key.p8"
      role: DBT_CI_ROLE
      warehouse: TRANSFORM_WH
      database: ANALYTICS_CI
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci') }}"
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: DBT_SVC
      private_key_path: "{{ env_var('HOME') }}/.snowflake/dbt_svc_key.p8"
      role: DBT_PROD_ROLE
      warehouse: TRANSFORM_WH
      database: ANALYTICS_PROD
      schema: analytics
      threads: 4
